<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CAFLAOEA Camera QR</title>

  <!-- Library QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e8f7ff, #dff7f0, #eee8ff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .camera-card {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
    }

    .title {
      text-align: center;
      margin-bottom: 18px;
    }

    .title h1 {
      margin: 0;
      font-size: 24px;
      color: #354052;
    }

    .title p {
      margin: 8px 0 0;
      color: #6b7280;
      font-size: 14px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 18px;
      background: #111;
    }

    .button-area {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      flex: 1;
      border: 0;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      background: #5b8def;
      color: white;
    }

    #stopButton {
      background: #ef6b73;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result-box {
      margin-top: 18px;
      padding: 15px;
      border-radius: 15px;
      background: #f5f7fa;
    }

    .result-title {
      font-weight: bold;
      color: #354052;
      margin-bottom: 8px;
    }

    #result {
      word-break: break-word;
      color: #374151;
      font-size: 14px;
      min-height: 20px;
    }

    .status {
      text-align: center;
      margin-top: 12px;
      font-size: 13px;
      color: #6b7280;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #5b8def;
      text-decoration: none;
      font-size: 14px;
    }

    /* TAMBAHAN: PILIHAN KAMERA */
    .camera-select-area {
      margin-top: 14px;
      display: flex;
      gap: 10px;
    }

    .camera-select-area button {
      background: #eef3ff;
      color: #354052;
      border: 1px solid #d7def0;
    }

    .camera-select-area button.active {
      background: #5b8def;
      color: white;
    }

    .camera-select-area button:disabled {
      opacity: 0.45;
    }
  </style>
</head>

<body>

  <div class="camera-card">

    <div class="title">
      <h1>📷 CAFLAOEA QR Scanner</h1>
      <p>Scanner kamera untuk ABSENSI SISWA CAFLAOEA</p>
    </div>

    <div id="reader"></div>

    <!-- TAMBAHAN: PILIH KAMERA -->
    <div class="camera-select-area">

      <button
        id="backCameraButton"
        onclick="selectCameraMode('back')"
      >
        🔙 Kamera Belakang
      </button>

      <button
        id="frontCameraButton"
        onclick="selectCameraMode('front')"
      >
        🤳 Kamera Depan
      </button>

    </div>

    <div class="button-area">
      <button id="startButton" onclick="startScanner()">
        📷 Buka Kamera
      </button>

      <button id="stopButton" onclick="stopScanner()" disabled>
        ⛔ Stop
      </button>
    </div>

    <div class="status" id="cameraStatus">
      Kamera belum diaktifkan.
    </div>

    <div class="result-box">
      <div class="result-title">
        Hasil QR
      </div>

      <div id="result">
        Belum ada QR yang dipindai.
      </div>
    </div>

    <a
      class="back-link"
      href="https://hayamuttaqi01-maker.github.io/caflaoea-camera/"
    >
      🔄 Muat ulang halaman
    </a>

  </div>


  <script>

    let html5QrCode = null;
    let scannerRunning = false;

    /* TAMBAHAN: DATA KAMERA */
    let availableCameras = [];
    let selectedCameraMode = "back";
    let selectedCameraId = null;
    let scanSent = false;


    const cameraStatus = document.getElementById("cameraStatus");
    const resultElement = document.getElementById("result");


    /*
     * PILIH MODE KAMERA
     *
     * HP:
     * back  = kamera belakang
     * front = kamera depan
     *
     * Laptop:
     * akan otomatis menggunakan webcam
     */
    function selectCameraMode(mode) {

      if (scannerRunning) {
        cameraStatus.textContent =
          "Hentikan kamera terlebih dahulu sebelum mengganti kamera.";

        return;
      }

      selectedCameraMode = mode;

      updateCameraButtons();

      if (mode === "back") {

        cameraStatus.textContent =
          "Mode kamera belakang dipilih.";

      } else {

        cameraStatus.textContent =
          "Mode kamera depan dipilih.";

      }
    }


    function updateCameraButtons() {

      const backButton =
        document.getElementById("backCameraButton");

      const frontButton =
        document.getElementById("frontCameraButton");


      backButton.classList.remove("active");
      frontButton.classList.remove("active");


      if (selectedCameraMode === "back") {

        backButton.classList.add("active");

      } else {

        frontButton.classList.add("active");

      }
    }


    /*
     * MENCARI KAMERA YANG TERSEDIA
     */
    async function getAvailableCameras() {

      try {

        availableCameras =
          await Html5Qrcode.getCameras();

        return availableCameras || [];

      } catch (error) {

        console.error(
          "Gagal mendapatkan daftar kamera:",
          error
        );

        return [];

      }

    }


    /*
     * MEMILIH KAMERA BERDASARKAN LABEL
     */
    function findCameraByMode(mode) {

      if (!availableCameras.length) {
        return null;
      }


      const cameras =
        availableCameras;


      /*
       * Kamera belakang biasanya mempunyai
       * kata seperti:
       *
       * back
       * rear
       * environment
       * world
       */
      if (mode === "back") {

        const backCamera =
          cameras.find(function(camera) {

            const label =
              String(camera.label || "").toLowerCase();

            return (
              label.includes("back") ||
              label.includes("rear") ||
              label.includes("environment") ||
              label.includes("world")
            );

          });


        if (backCamera) {
          return backCamera.id;
        }

      }


      /*
       * Kamera depan biasanya mempunyai:
       *
       * front
       * user
       * facing
       */
      if (mode === "front") {

        const frontCamera =
          cameras.find(function(camera) {

            const label =
              String(camera.label || "").toLowerCase();

            return (
              label.includes("front") ||
              label.includes("user") ||
              label.includes("facing")
            );

          });


        if (frontCamera) {
          return frontCamera.id;
        }

      }


      /*
       * FALLBACK
       *
       * Kalau kamera yang dicari tidak ditemukan,
       * gunakan kamera pertama yang tersedia.
       *
       * Ini penting untuk laptop/PC.
       */
      return cameras[0].id;

    }


    /*
     * MEMBUKA KAMERA
     */
    async function startScanner() {

      if (scannerRunning) {
        return;
      }


      cameraStatus.textContent =
        "Meminta izin kamera...";


      resultElement.textContent =
        "Menyiapkan kamera...";


      scanSent = false;


      try {

        /*
         * Bersihkan scanner lama jika ada.
         */
        if (html5QrCode) {

          try {
            await html5QrCode.stop();
          } catch (e) {}

          try {
            await html5QrCode.clear();
          } catch (e) {}

          html5QrCode = null;

        }


        /*
         * Cek apakah browser mendukung kamera.
         */
        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {

          throw new Error(
            "Browser tidak mendukung akses kamera."
          );

        }


        /*
         * Buat scanner baru.
         */
        html5QrCode =
          new Html5Qrcode("reader");


        /*
         * Minta daftar kamera.
         */
        availableCameras =
          await getAvailableCameras();


        /*
         * Kalau kamera berhasil terdeteksi,
         * gunakan ID kamera.
         */
        if (availableCameras.length > 0) {

          selectedCameraId =
            findCameraByMode(
              selectedCameraMode
            );

        }


        /*
         * Ukuran QR menyesuaikan layar.
         */
        const qrSize =
          Math.min(
            250,
            Math.max(
              180,
              Math.floor(
                window.innerWidth * 0.65
              )
            )
          );


        const config = {

          fps: 10,

          qrbox: {
            width: qrSize,
            height: qrSize
          },

          aspectRatio: 1.0,

          disableFlip: false

        };


        /*
         * JIKA KAMERA ID TERSEDIA
         *
         * Ini digunakan agar laptop tidak
         * dipaksa memakai environment.
         */
        if (selectedCameraId) {

          await html5QrCode.start(
            selectedCameraId,
            config,
            onScanSuccess,
            onScanFailure
          );

        } else {

          /*
           * FALLBACK
           *
           * Tidak menggunakan:
           *
           * facingMode:
           * {
           *   exact: "environment"
           * }
           *
           * sehingga OverconstrainedError
           * dapat dihindari.
           */
          await html5QrCode.start(
            {
              facingMode: "environment"
            },
            config,
            onScanSuccess,
            onScanFailure
          );

        }


        scannerRunning = true;


        cameraStatus.textContent =
          "Kamera aktif. Arahkan kamera ke QR siswa.";


        resultElement.textContent =
          "Belum ada QR yang dipindai.";


        document.getElementById(
          "startButton"
        ).disabled = true;


        document.getElementById(
          "stopButton"
        ).disabled = false;


        document.getElementById(
          "backCameraButton"
        ).disabled = true;


        document.getElementById(
          "frontCameraButton"
        ).disabled = true;

      } catch (error) {

        console.error(
          "Gagal membuka kamera:",
          error
        );


        scannerRunning = false;


        cameraStatus.textContent =
          "Kamera tidak dapat dibuka. Periksa izin kamera browser.";


        resultElement.textContent =
          "Gagal membuka kamera: " +
          error;


        document.getElementById(
          "startButton"
        ).disabled = false;


        document.getElementById(
          "stopButton"
        ).disabled = true;


        document.getElementById(
          "backCameraButton"
        ).disabled = false;


        document.getElementById(
          "frontCameraButton"
        ).disabled = false;

      }

    }


    /*
     * HASIL SCAN QR
     */
    function onScanSuccess(
      decodedText,
      decodedResult
    ) {

      if (scanSent) {
        return;
      }


      scanSent = true;


      console.log(
        "QR berhasil dibaca:",
        decodedText
      );


      resultElement.textContent =
        decodedText;


      cameraStatus.textContent =
        "QR berhasil dibaca.";


      /*
       * Format QR database CAFLAOEA:
       *
       * CAFLAOEA|StudentID|NISN
       *
       * Contoh:
       * CAFLAOEA|CAF0001|1000000001
       */

      const parts =
        decodedText.split("|");


      if (
        parts.length >= 3 &&
        parts[0] === "CAFLAOEA"
      ) {

        const studentId =
          parts[1];

        const nisn =
          parts[2];


        resultElement.innerHTML =
          "<strong>QR CAFLAOEA terdeteksi</strong><br><br>" +
          "StudentID: " +
          escapeHtml(studentId) +
          "<br>" +
          "NISN: " +
          escapeHtml(nisn);

      } else {

        resultElement.innerHTML =
          "<strong>QR terbaca</strong><br><br>" +
          escapeHtml(decodedText);

      }


      /*
       * KIRIM HASIL QR KE APLIKASI UTAMA
       *
       * Aplikasi utama CAFLAOEA menerima:
       *
       * CAFLAOEA_QR_SCAN
       */
      try {

        if (
          window.opener &&
          !window.opener.closed
        ) {

          window.opener.postMessage(
            {
              type: "CAFLAOEA_QR_SCAN",
              qrText: decodedText
            },
            "*"
          );

        }

      } catch (error) {

        console.error(
          "Gagal mengirim hasil QR:",
          error
        );

      }


      /*
       * Beri waktu agar hasil QR terlihat,
       * kemudian kamera dihentikan.
       */
      setTimeout(
        function() {
          stopScanner();
        },
        500
      );

    }


    function onScanFailure(error) {

      /*
       * Error kecil ketika QR belum ditemukan
       * sengaja tidak ditampilkan agar layar tidak penuh.
       */

    }


    /*
     * MENGHENTIKAN KAMERA
     */
    async function stopScanner() {

      if (
        !html5QrCode ||
        !scannerRunning
      ) {

        return;

      }


      try {

        await html5QrCode.stop();

      } catch (error) {

        console.error(
          "Gagal menghentikan kamera:",
          error
        );

      }


      try {

        await html5QrCode.clear();

      } catch (error) {}


      scannerRunning = false;


      cameraStatus.textContent =
        "Kamera telah dihentikan.";


      document.getElementById(
        "startButton"
      ).disabled = false;


      document.getElementById(
        "stopButton"
      ).disabled = true;


      document.getElementById(
        "backCameraButton"
      ).disabled = false;


      document.getElementById(
        "frontCameraButton"
      ).disabled = false;


      scanSent = false;

    }


    function escapeHtml(value) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    window.addEventListener(
      "beforeunload",
      function() {

        if (
          html5QrCode &&
          scannerRunning
        ) {

          html5QrCode
            .stop()
            .catch(
              function() {}
            );

        }

      }
    );


    /*
     * MODE AWAL
     */
    updateCameraButtons();

  </script>

</body>
</html>
